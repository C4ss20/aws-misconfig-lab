name: Validate IAM Policy Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m iam_audit.cli examples/overly-permissive-policy.json --output reports/lab-policy-report.json
